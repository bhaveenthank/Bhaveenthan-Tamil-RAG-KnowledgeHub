[project]
name = "tvu-common"
version = "0.1.0"
description = "Shared utilities for TamilVU corpus pipeline packages"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvu_common"]
