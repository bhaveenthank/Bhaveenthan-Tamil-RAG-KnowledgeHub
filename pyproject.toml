[project]
name = "tvu-scraper"
version = "0.1.0"
description = "Tamil Virtual Academy literary corpus scraper and RAG index builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "duckdb>=1.1.0",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "pydantic>=2.8.0",
  "python-slugify>=8.0.4",
  "pyyaml>=6.0.2",
  "requests>=2.32.0",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
index = [
  "chromadb>=0.5.5",
  "tantivy>=0.22.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
tvu-scraper = "tvu_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvu_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
