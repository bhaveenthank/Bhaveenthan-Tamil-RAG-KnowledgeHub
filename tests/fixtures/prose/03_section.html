  <article class="prose-section" data-prose-section data-section-id="118166">
    <h1 class="section-title" data-section-title>யாரைத் தொழுவது?</h1>
    <p class="prose-paragraph" data-prose-paragraph>
      அறிவைத் தேடும் மனம் கேள்விகளை எழுப்புகிறது. தெளிவான சிந்தனை மனிதரை
      உண்மையை நோக்கி அழைத்துச் செல்கிறது.
    </p>
    <p class="prose-paragraph" data-prose-paragraph>
      மொழியும் இலக்கியமும் அனுபவத்தைப் பகிரும் வழிகள். அவற்றை ஆதாரத்துடன்
      படிப்பது ஆய்வுக்கும் உரையாடலுக்கும் வலிமை தருகிறது.
    </p>
