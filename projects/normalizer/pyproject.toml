[project]
name = "tvu-normalizer"
version = "0.1.0"
description = "TamilVU corpus normalization, validation, and readiness audits"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tvu-normalize-corpus = "corpus.normalize_corpus:main"
tvu-normalize-category = "corpus.normalize_category_corpus:main"
tvu-validate-corpus = "corpus.validate_corpus:main"
tvu-validate-category = "corpus.validate_category_corpus:main"
tvu-audit-corpus-readiness = "corpus.audit_corpus_readiness:main"
tvu-audit-multi-category-readiness = "corpus.audit_multi_category_readiness:main"
tvu-inspect-pilot-sources = "corpus.inspect_pilot_sources:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]
