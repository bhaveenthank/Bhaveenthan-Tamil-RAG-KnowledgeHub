[project]
name = "tvu-retrieval"
version = "0.1.0"
description = "TamilVU retrieval, embedding, vector index, analytics, and RAG context tooling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.0"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]

[project.scripts]
tvu-build-retrieval-corpus = "enrichment.build_retrieval_ready_corpus:main"
tvu-build-embeddings = "embeddings.build_embeddings:main"
tvu-build-vector-index = "vector_index.build_faiss_index:main"
tvu-expand-query = "retrieval.expand_query:main"
tvu-build-context = "rag.build_context:main"
tvu-export-citations = "rag.export_citations:main"
tvu-build-occurrence-index = "analytics.build_occurrence_index:main"
tvu-search-occurrences = "analytics.search_occurrences:main"
tvu-analyze-term = "analytics.analyze_term:main"
tvu-ask-analytics = "analytics.ask_analytics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics", "src/embeddings", "src/enrichment", "src/rag", "src/retrieval", "src/vector_index"]
