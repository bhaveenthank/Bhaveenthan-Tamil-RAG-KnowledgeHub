[project]
name = "tvu-crawler"
version = "0.1.0"
description = "TamilVU crawler, inspector, and raw snapshot tooling"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12.3", "httpx>=0.27.0", "lxml>=5.2.0", "pyyaml>=6.0.2", "requests>=2.32.0"]

[project.scripts]
tvu-scraper = "tvu_scraper.cli:main"
tvu-inspect-site = "inspector.site_inspector:main"
tvu-discover-dynamic-content = "inspector.discover_dynamic_content:main"
tvu-inspect-iframes = "inspector.inspect_iframe_endpoints:main"
tvu-inspect-hymn = "inspector.inspect_hymn_endpoint:main"
tvu-inspect-commentary = "inspector.inspect_commentary_endpoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector", "src/tvu_scraper"]
