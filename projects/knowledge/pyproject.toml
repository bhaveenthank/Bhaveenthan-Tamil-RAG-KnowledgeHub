[project]
name = "tvu-knowledge"
version = "0.1.0"
description = "TamilVU annotation and knowledge extraction tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tvu-validate-registries = "knowledge.validate_registries:main"
tvu-analyze-knowledge-readiness = "knowledge.analyze_knowledge_readiness:main"
tvu-validate-annotations = "knowledge.validate_annotations:main"
tvu-analyze-annotation-readiness = "knowledge.analyze_annotation_readiness:main"
tvu-evaluate-entity-extraction = "knowledge.evaluate_entity_extraction:main"
tvu-analyze-extraction-readiness = "knowledge.analyze_extraction_readiness:main"
tvu-annotate-thevaram-entities = "knowledge.annotate_thevaram_entities:main"
tvu-annotate-thevaram-entities-v3 = "knowledge.annotate_thevaram_entities_v3:main"
tvu-link-thevaram-pozhppurai = "knowledge.link_thevaram_pozhippurai:main"
tvu-link-thevaram-pozhppurai-v3 = "knowledge.link_thevaram_pozhippurai_v3:main"
tvu-build-pozhppurai-links-v4 = "knowledge.build_pozhippurai_links_v4:main"
tvu-build-pozhppurai-links-v4-hardened = "knowledge.build_pozhippurai_links_v4_hardened:main"
tvu-build-pozhppurai-link-qa-pack = "knowledge.build_pozhippurai_link_qa_pack:main"
tvu-review-pozhppurai-link-qa-pack = "knowledge.review_pozhippurai_link_qa_pack:main"
tvu-build-pozhppurai-review-viewer = "knowledge.build_pozhippurai_review_viewer:main"
tvu-build-pozhppurai-error-reviewer = "knowledge.build_pozhippurai_error_reviewer:main"
tvu-validate-thevaram-ontology = "knowledge.validate_thevaram_ontology:main"
tvu-analyze-pozhppurai-link-hardening = "knowledge.analyze_pozhippurai_link_hardening:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
